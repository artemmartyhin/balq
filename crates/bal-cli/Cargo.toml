[package]
name = "balq"
description = "BAL query: local archive of contract storage history, verified against block headers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "balq"
path = "src/main.rs"

[dependencies]
bal-codec = { version = "0.2.0", path = "../bal-codec" }
bal-source = { version = "0.2.0", path = "../bal-source" }
bal-archive = { version = "0.2.0", path = "../bal-archive" }
bal-layout = { version = "0.2.0", path = "../bal-layout" }
alloy-primitives.workspace = true
clap.workspace = true
clap_complete = "4"
toml = "0.9"
anyhow.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde.workspace = true
async-trait.workspace = true
tempfile.workspace = true
indicatif = "0.18"
owo-colors = { version = "4", features = ["supports-colors"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
