name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env: { RUSTDOCFLAGS: -D warnings }

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --exclude bal-node

  version:
    name: version bookkeeping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace version has a CHANGELOG section, every crate depends on
      # its siblings at that same version, and @balq/viem ships with it.
      - run: |
          set -euo pipefail
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "workspace version $v"
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no '## [$v]' section"; exit 1; }
          bad=$(grep -hoE '\{ version = "[^"]+", path = "\.\./bal-' crates/*/Cargo.toml | grep -v "\"$v\"" || true)
          [ -z "$bad" ] || { echo "sibling deps not at $v:"; echo "$bad"; exit 1; }
          grep -q "\"version\": \"$v\"" packages/viem/package.json || { echo "@balq/viem is not at $v"; exit 1; }

  msrv:
    name: msrv (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --exclude bal-node

  # Real-network smoke against the public Platåberget gateway. Allowed to fail:
  # the gateway is a shared devnet resource.
  probe:
    name: probe Platåberget
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p balq -- probe --rpc https://rpc.plataberget.ethpandaops.io --age 1000

  probe-sepolia:
    name: probe Sepolia
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p balq -- probe --rpc https://ethereum-sepolia-rpc.publicnode.com --age 1000
