# Prebuilds for @balq/node. Runs on every push/PR for the host platform and
# publishes per-platform packages on a `node-v*` tag. Set up before the first
# user, per spec §8: a first user who gets a build error leaves.
name: bal-node

on:
  push:
    branches: [main]
    tags: ["node-v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.settings.target }}" }
      - name: aarch64 linux cross toolchain
        if: matrix.settings.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - run: cargo test --workspace --exclude bal-node
        if: "!matrix.settings.cross"
      - run: npm ci
        working-directory: crates/bal-node
      - run: npx napi build --release --platform --target ${{ matrix.settings.target }}
        working-directory: crates/bal-node
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/bal-node/*.node
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/node-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
        working-directory: crates/bal-node
      - uses: actions/download-artifact@v4
        with: { path: crates/bal-node/artifacts }
      - run: npx napi create-npm-dirs && npx napi artifacts && npx napi prepublish -t npm --no-gh-release
        working-directory: crates/bal-node
      - run: npm publish --access public
        working-directory: crates/bal-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
