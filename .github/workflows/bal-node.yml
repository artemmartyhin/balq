# Prebuilds for balq. Runs on every push/PR for the host platform and
# publishes per-platform packages on a `node-v*` tag. Set up before the first
# user, per spec §8: a first user who gets a build error leaves.
name: bal-node

on:
  push:
    branches: [main]
    tags: ["node-v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.settings.target }}" }
      - name: aarch64 linux cross toolchain
        if: matrix.settings.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - run: cargo test --workspace --exclude bal-node
        if: "!matrix.settings.cross"
      - run: npm ci --ignore-scripts
        working-directory: crates/bal-node
      - run: npx napi build --release --platform --target ${{ matrix.settings.target }}
        working-directory: crates/bal-node
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/bal-node/*.node
          if-no-files-found: error
      # The JS loader and the type declarations are generated by `napi build`;
      # the publish job needs them alongside the binaries.
      - uses: actions/upload-artifact@v4
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        with:
          name: js-loader
          path: |
            crates/bal-node/index.js
            crates/bal-node/index.d.ts
          if-no-files-found: error

  # Attach every platform binary and the generated loader to the tag's GitHub
  # release, so a release can also be published by hand (npm accounts with
  # 2FA on writes need a one-time code that CI cannot supply).
  release-assets:
    needs: build
    if: startsWith(github.ref, 'refs/tags/node-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - run: find assets -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**/*
          fail_on_unmatched_files: true

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/node-v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm ci --ignore-scripts
        working-directory: crates/bal-node
      - uses: actions/download-artifact@v4
        with:
          name: js-loader
          path: crates/bal-node
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: crates/bal-node/artifacts
      - run: test -f index.js && test -f index.d.ts
        working-directory: crates/bal-node
      - run: npx napi create-npm-dirs && npx napi artifacts
        working-directory: crates/bal-node
      - run: ls -R npm | head -40
        working-directory: crates/bal-node
      # `prepublish` publishes the per-platform packages itself, so it needs
      # the token too — not only the final `npm publish` of the main package.
      - run: npx napi prepublish -t npm --no-gh-release
        working-directory: crates/bal-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public
        working-directory: crates/bal-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
