[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Artem <artemmartyhin@gmail.com>"]
repository = "https://github.com/artemmartyhin/balq"
homepage = "https://github.com/artemmartyhin/balq"
readme = "README.md"
keywords = ["ethereum", "eip-7928", "storage", "archive", "bal"]
categories = ["cryptography::cryptocurrencies", "database"]

[workspace.dependencies]
alloy-primitives = { version = "1", features = ["rlp"] }
alloy-rlp = { version = "0.3", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
redb = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
